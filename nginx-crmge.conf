server {
    listen 80;
    server_name crm.midominio.com;

    # Redirigir a HTTPS si tienes SSL (descomenta cuando tengas cert)
    # return 301 https://$server_name$request_uri;

    # Frontend estático
    root /apps/crmge/client/dist;
    index index.html;

    # API - reverse proxy al backend Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Export endpoints (generan archivos grandes)
    location /api/export/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Frontend SPA - todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica
    location ~ /\. {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}

