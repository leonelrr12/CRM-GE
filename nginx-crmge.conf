# Plantilla de nginx para CRM-GE.
# ⚠️ deploy.sh solo la instala si /etc/nginx/sites-available/crmge no existe:
# nunca pisa la config del servidor (certbot puede gestionarla con SSL).
# Si el dominio cambia, ajusta server_name y las rutas del certificado.

server {
    listen 80;
    server_name crm.greenenergytechnologie.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.greenenergytechnologie.com;

    ssl_certificate /etc/letsencrypt/live/crm.greenenergytechnologie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.greenenergytechnologie.com/privkey.pem;

    # Frontend estático
    root /apps/crmge/client/dist;
    index index.html;

    # API - reverse proxy al backend Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Export endpoints (generan archivos grandes)
    location /api/export/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Imágenes subidas (recibos de luz)
    location /uploads/ {
        proxy_pass http://147.93.145.67/uploads/;
    }

    # Frontend SPA - todas las rutas al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica
    location ~ /\. {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
